name: Deploy Smart Service Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" << 'EOF'
            cd ~/smart-service-platform

            git pull origin main

            docker stop smart-service-platform || true
            docker rm smart-service-platform || true

            docker build -t smart-service-platform .

            docker run -d \
              --name smart-service-platform \
              --restart unless-stopped \
              --env-file .env \
              -p 80:5000 \
              smart-service-platform
          EOF